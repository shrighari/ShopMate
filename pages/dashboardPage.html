<!doctype html>
<!-- Main workspace for group selection, budget overview, and shopping categories. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="dashboard.title">ShopMate Dashboard</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="appContainer">
      <!-- Dashboard Header -->
      <header class="dashboardHeader">
        <div class="headerLeftSection">
          <img
            src="../assets/logos/shopMateLogo.png"
            alt="ShopMate Logo"
            class="appLogo"
          />
          <h1 class="appName" data-i18n="common.appName">ShopMate</h1>
        </div>
        <button type="button" class="menuButton" aria-label="Open Menu">
          <img
            data-icon-folder="navigation" data-icon-name="menu"
            class="icon navigationIcon"
            alt=""
          />
        </button>
      </header>
      <!-- Main Dashboard -->
      <main class="pageContent">
        <!-- Dashboard loading placeholders stay hidden unless initialization takes long enough to show them. -->
        <div class="pageSkeleton dashboardPageSkeleton" id="dashboardPageSkeleton" aria-hidden="true">
          <div class="skeletonBlock skeletonGroupSelector"></div>
          <div class="skeletonBlock skeletonBudgetCard">
            <span class="skeletonBlock skeletonLine skeletonLineShort"></span>
            <span class="skeletonBlock skeletonLine skeletonLineMedium"></span>
            <span class="skeletonBlock skeletonLine skeletonLineFull"></span>
          </div>
          <div class="skeletonBlock skeletonCategoryCard">
            <span class="skeletonBlock skeletonLine skeletonLineMedium"></span>
            <span class="skeletonBlock skeletonLine skeletonLineFull"></span>
            <span class="skeletonBlock skeletonLine skeletonLineShort"></span>
          </div>
          <div class="skeletonBlock skeletonCategoryCard">
            <span class="skeletonBlock skeletonLine skeletonLineMedium"></span>
            <span class="skeletonBlock skeletonLine skeletonLineFull"></span>
            <span class="skeletonBlock skeletonLine skeletonLineShort"></span>
          </div>
        </div>
        <!-- Group Selector -->
        <section class="groupDropdownSection">
          <button
            type="button"
            class="groupDropdownButton"
            id="groupDropdownButton"
          >
            <span id="selectedGroupName" data-i18n="dashboard.noGroupSelected">
              No Group Selected
            </span>
            <span class="dropdownArrow">
              <img
                data-icon-folder="navigation" data-icon-name="collapse"
                class="icon smallIcon"
                alt=""
              />
            </span>
          </button>
        </section>
        <!-- Budget Dashboard -->
      <!-- Group-level monthly budget summary; its contents are rendered by dashboardPage.js. -->
      <section
          id="budgetDashboardWidget"
          class="budgetDashboardWidget"
        ></section>
        <!-- Empty State -->
        <section class="emptyStateSection" id="emptyStateSection">
          <p class="emptyStateText" data-i18n="dashboard.selectOrCreateGroup">
            Select or create a group
          </p>
        </section>
        <!-- Lets each user choose the display order for categories in this group. -->
        <div class="sortControl hidden" id="categorySortControl">
          <label for="categorySortSelect" data-i18n="dashboard.sortCategories">
            Sort categories
          </label>
          <select id="categorySortSelect" class="sortControlSelect">
            <option value="default" data-i18n="dashboard.sortDefault">
              Default order
            </option>
            <option value="newest-first" data-i18n="dashboard.sortNewestFirst">
              Newest added first
            </option>
            <option value="newest-last" data-i18n="dashboard.sortNewestLast">
              Newest added last
            </option>
            <option value="pending-desc" data-i18n="dashboard.sortMostPending">
              Most pending
            </option>
          </select>
        </div>
        <!-- Categories -->
        <section class="categoryList" id="categoryList"></section>
      </main>
      <!-- Footer -->
      <footer class="appFooter" data-i18n="common.footer">
        © Wisemen IT Solutions
      </footer>
      <!-- Floating Action Button -->
      <button
        type="button"
        class="floatingActionButton"
        id="openCategoryBottomSheetButton"
        aria-label="Add Category"
      >
        <img
          data-icon-folder="actions" data-icon-name="add"
          class="icon largeIcon"
          alt=""
        />
      </button>
      <!-- Side Drawer Overlay -->
      <div
        class="sideDrawerOverlay"
        id="sideDrawerOverlay"
        onclick="closeSideDrawer()"
      ></div>
      <!-- Side Drawer -->
      <aside class="sideDrawer right" id="sideDrawer"></aside>
      <!-- Bottom Sheet Overlay -->
      <div
        id="screenOverlay"
        class="screenOverlay hidden"
        onclick="closeBottomSheet()"
      ></div>
      <!-- Bottom Sheet -->
      <section class="bottomSheet hidden" id="bottomSheet">
        <div class="bottomSheetHandle"></div>
        <div class="bottomSheetContent" id="bottomSheetContent"></div>
      </section>
    </div>
    <!-- CORE APPLICATION FILES -->
    <script src="../js/stateManager.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/authManager.js"></script>
    <script src="../js/groupService.js"></script>
    <!-- LOCALIZATION FRAMEWORK -->
    <script src="../js/localization/languageManager.js"></script>
    <!-- APPLICATION BOOTSTRAP -->
    <script src="../js/bootstrap.js"></script>
    <!-- DASHBOARD -->
    <script src="../js/dashboardPage.js"></script>
    <!-- APPLICATION INITIALIZATION -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        initializeApplication();
      });
    </script>
  </body>
</html>
