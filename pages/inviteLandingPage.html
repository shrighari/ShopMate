<!doctype html>
<!-- Accepts a group invitation link and routes existing or new users through authentication. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="invite.title">Invite</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <!-- Invitation screen supports a backend email link or a manually entered invitation code. -->
    <div class="authPage">
      <div class="authCard">
        <h1 class="authTitle" data-i18n="invite.groupInvitation">
          Group Invitation
        </h1>
        <p class="authSubtitle" data-i18n="invite.invitedToJoin">
          You were invited to join a group
        </p>
        <input
          type="text"
          class="authInput"
          id="inviteCodeInput"
          placeholder="Invite Code"
          data-i18n-placeholder="invite.inviteCode"
        />
        <button
          class="authButton"
          onclick="processInvite()"
          data-i18n="common.continue"
        >
          Continue
        </button>
      </div>
    </div>
    <!-- Load account and invitation dependencies before page initialization. -->
    <script src="../js/stateManager.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/authManager.js"></script>
    <script src="../js/groupService.js"></script>
    <script src="../js/localization/languageManager.js"></script>
    <!-- Route invitation codes to account creation, sign-in, or direct acceptance. -->
    <script>
      // Keep the invite code through authentication so the account email can be checked before joining.
      async function processInvite(inviteCodeFromLink) {
        const inviteCode = document
          .getElementById("inviteCodeInput")
          .value.trim() || (inviteCodeFromLink || "").trim();
        if (!inviteCode) {
          showDialog(t("auth.invalidInvite"), t("auth.invalidInviteMessage"));
          return;
        }
        localStorage.setItem("pendingInvite", inviteCode);
        if (!isUserLoggedIn()) {
          const invite = validateInvite(inviteCode);
          const nextPage =
            invite && isEmailRegistered(invite.email)
              ? "./loginPage.html"
              : "./registerPage.html";
          window.location.href = nextPage;
          return;
        }
        const currentUser = getCurrentUser();
        const security = currentUser?.security || {};
        const needsUnlock =
          security.appLockEnabled === true &&
          sessionStorage.getItem("shopMateAppUnlocked") !== "true";
        if (needsUnlock) {
          window.location.href = "./loginPage.html";
          return;
        }
        await joinGroupFromInvite(inviteCode);
      }
      // Load translations and automatically process invitation links supplied by the backend email.
      document.addEventListener("DOMContentLoaded", async function () {
        await initializeLocalization();
        const inviteCode = new URLSearchParams(window.location.search).get("code");
        if (inviteCode) {
          document.getElementById("inviteCodeInput").value = inviteCode;
          await processInvite(inviteCode);
        }
      });
    </script>
  </body>
</html>
