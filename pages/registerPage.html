<!doctype html>
<!-- Creates a user account, the first shopping group, and optional biometric setup. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="register.title">Register</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <!-- Registration form collects account details and creates the user's first group. -->
    <div class="authPage">
      <!-- Registration card groups identity fields, optional biometric setup, and submission. -->
      <div class="authCard">
        <h1 class="authTitle" data-i18n="register.title">Register</h1>
        <!-- Submit account details and the initial group name to the registration handler. -->
        <form id="registerForm" onsubmit="registerUser(event)">
          <input
            type="text"
            class="authInput"
            id="registerFirstNameInput"
            placeholder="First Name"
            data-i18n-placeholder="register.firstName"
            autocomplete="given-name"
          />
          <input
            type="text"
            class="authInput"
            id="registerLastNameInput"
            placeholder="Last Name"
            data-i18n-placeholder="register.lastName"
            autocomplete="family-name"
          />
          <input
            type="email"
            class="authInput"
            id="registerEmailInput"
            placeholder="Email Address"
            data-i18n-placeholder="register.email"
            autocomplete="email"
          />
          <input
            type="password"
            class="authInput"
            id="registerPasswordInput"
            placeholder="Password"
            data-i18n-placeholder="register.password"
            autocomplete="new-password"
          />
          <input
            type="password"
            class="authInput"
            id="registerConfirmPasswordInput"
            placeholder="Confirm Password"
            data-i18n-placeholder="register.confirmPassword"
            autocomplete="new-password"
          />
          <p class="authInviteText hidden" id="registerInvitationNotice" data-i18n="register.invitationNotice">
            You were invited to join a group. Use the invited email address to create your account.
          </p>
          <div id="registrationGroupField">
            <input
              type="text"
              class="authInput"
              id="groupNameInput"
              placeholder="Group Name"
              data-i18n-placeholder="register.groupName"
              autocomplete="off"
            />
          </div>
          <label class="biometricToggle">
            <input type="checkbox" id="biometricCheckbox" />
            <span data-i18n="register.biometric">
              Protect ShopMate with Biometrics
            </span>
          </label>
          <button
            type="submit"
            class="authButton"
            id="registerSubmitButton"
            data-i18n="register.createGroup"
          >
            Create Shopping Group
          </button>
          <button
            type="button"
            class="authTextButton"
            onclick="window.location.href = './loginPage.html'"
          >
            <span data-i18n="register.alreadyHaveAccount">
              Already have an account? Login
            </span>
          </button>
        </form>
      </div>
    </div>
    <!-- Core Application -->
    <script src="../js/stateManager.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/authManager.js"></script>
    <script src="../js/groupService.js"></script>
    <!-- Localization -->
    <script src="../js/localization/languageManager.js"></script>
    <!-- Application Bootstrap -->
    <script src="../js/bootstrap.js"></script>
    <!-- Start localization, security, and registration-page initialization after markup loads. -->
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        await initializeApplication();
        initializeRegistrationForm();
      });
    </script>
  </body>
</html>
