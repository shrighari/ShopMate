<!doctype html>
<!-- Shows one category's shopping items, tabs, search, and bulk item actions. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="category.title">ShopMate Category</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="appContainer">
      <!-- HEADER -->
      <header class="modernHeader">
        <button class="modernBackButton" id="backButton">
          <img
            data-icon-folder="navigation" data-icon-name="back"
            class="icon navigationIcon"
            alt="Back"
          />
        </button>
        <h1
          class="modernPageTitle"
          id="categoryPageTitle"
          data-i18n="category.title"
        >
          Category
        </h1>
      </header>
      <!-- MAIN CONTENT -->
      <main class="pageContent">
        <!-- List loading placeholders stay hidden unless catalog or localization loading takes long enough. -->
        <div class="pageSkeleton categoryPageSkeleton" id="categoryPageSkeleton" aria-hidden="true">
          <div class="skeletonBlock skeletonTabs"></div>
          <div class="skeletonBlock skeletonSearch"></div>
          <div class="skeletonSortRow">
            <span class="skeletonBlock skeletonLine skeletonLineShort"></span>
            <span class="skeletonBlock skeletonSortControl"></span>
          </div>
          <div class="skeletonBlock skeletonItemCard">
            <span class="skeletonBlock skeletonLine skeletonLineMedium"></span>
            <span class="skeletonBlock skeletonLine skeletonLineFull"></span>
            <span class="skeletonBlock skeletonLine skeletonLineShort"></span>
          </div>
          <div class="skeletonBlock skeletonItemCard">
            <span class="skeletonBlock skeletonLine skeletonLineMedium"></span>
            <span class="skeletonBlock skeletonLine skeletonLineFull"></span>
            <span class="skeletonBlock skeletonLine skeletonLineShort"></span>
          </div>
          <div class="skeletonBlock skeletonItemCard">
            <span class="skeletonBlock skeletonLine skeletonLineMedium"></span>
            <span class="skeletonBlock skeletonLine skeletonLineFull"></span>
            <span class="skeletonBlock skeletonLine skeletonLineShort"></span>
          </div>
        </div>
        <!-- TABS -->
        <div class="modernTabContainer">
          <button
            class="modernTabButton tabButton activeTab"
            data-tab="lists"
            data-i18n="category.lists"
          >
            Lists
          </button>
          <button
            class="modernTabButton tabButton"
            data-tab="favorites"
            data-i18n="category.favorites"
          >
            Favorites
          </button>
          <button
            class="modernTabButton tabButton"
            data-tab="purchased"
            data-i18n="category.purchased"
          >
            Purchased
          </button>
        </div>
        <!-- SEARCH -->
        <div class="searchWrapper">
          <span class="searchIcon">
            <img
              data-icon-folder="actions" data-icon-name="search"
              class="icon actionIcon"
              alt="Search"
            />
          </span>
          <input
            type="text"
            class="modernSearchInput searchInput"
            placeholder="Search Items"
            data-i18n-placeholder="category.searchItems"
          />
        </div>
        <!-- Lets users change item display order without changing saved item order. -->
        <div class="sortControl itemSortControl">
          <label for="itemSortSelect" data-i18n="category.sortItems">
            Sort items
          </label>
          <select id="itemSortSelect" class="sortControlSelect" data-split-select>
            <option value="default" data-i18n="category.sortDefault">
              Default order
            </option>
            <option value="newest-first" data-i18n="category.sortNewestFirst">
              Newest added first
            </option>
            <option value="newest-last" data-i18n="category.sortNewestLast">
              Newest added last
            </option>
            <option value="recurring-first" data-recurrence-sort data-i18n="category.sortRecurringFirst">
              Recurring first
            </option>
            <option value="one-off-first" data-recurrence-sort data-i18n="category.sortOneOffFirst">
              One-off first
            </option>
          </select>
        </div>
        <!-- EMPTY STATE -->
        <!-- Empty-state message is shown when the active tab has no matching items. -->
        <section class="emptyStateSection" id="itemEmptyState"></section>
        <!-- ITEM LIST -->
        <section class="itemList" id="itemList"></section>
      </main>
      <!-- BULK ACTION BAR -->
      <div class="bulkActionBar hidden" id="bulkActionBar">
        <div
          class="bulkSelectionCount"
          id="bulkSelectionCount"
          data-i18n="category.oneSelected"
        >
          1 Selected
        </div>

        <button
          class="bulkActionButton bulkActionButtonFavorite"
          id="bulkFavoriteButton"
        >
          <img
            data-icon-folder="actions" data-icon-name="favorite-outline"
            class="icon actionIcon"
            alt="Favorite"
          />
        </button>

        <button
          class="bulkActionButton bulkActionButtonPurchased"
          id="bulkPurchasedButton"
        >
          <img
            data-icon-folder="actions" data-icon-name="purchased"
            class="icon actionIcon"
            alt="Purchased"
          />
        </button>

        <button
          class="bulkActionButton bulkActionButtonDelete"
          id="bulkDeleteButton"
        >
          <img
            data-icon-folder="actions" data-icon-name="delete"
            class="icon actionIcon"
            alt="Delete"
          />
        </button>
      </div>
      <!-- FOOTER -->
      <footer class="appFooter" data-i18n="common.footer">
        © Wisemen IT Solutions
      </footer>
      <!-- FLOATING ACTION BUTTON -->
      <button class="floatingActionButton" id="openItemBottomSheetButton">
        <img
          data-icon-folder="actions" data-icon-name="add"
          class="icon largeIcon"
          alt="Add Item"
        />
      </button>
      <!-- SNACKBAR -->
      <div class="snackbar hidden" id="snackbar">
        <span class="snackbarText" id="snackbarText"></span>
        <button
          class="snackbarButton"
          id="snackbarUndoButton"
          data-i18n="common.undo"
        >
          Undo
        </button>
      </div>
      <!-- OVERLAY -->
      <div
        id="screenOverlay"
        class="screenOverlay hidden"
        onclick="closeBottomSheet()"
      ></div>
      <!-- BOTTOM SHEET -->
      <div class="bottomSheet hidden" id="bottomSheet">
        <div class="bottomSheetHandle"></div>
        <div class="bottomSheetContent" id="bottomSheetContent"></div>
      </div>
    </div>
    <!-- SCRIPTS -->
    <script src="../js/stateManager.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/favoritesManager.js"></script>
    <script src="../js/itemManager.js"></script>
    <script src="../js/swipeGestures.js"></script>
    <script src="../js/snackbarManager.js"></script>
    <script src="../js/selectionManager.js"></script>
    <script src="../js/authManager.js"></script>
    <script src="../js/categoryPage.js"></script>
    <script src="../js/localization/languageManager.js"></script>
    <script src="../js/bootstrap.js"></script>
    <!-- Initialize category tabs, item data, gestures, and localization after page load. -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        initializeApplication();
      });
    </script>
  </body>
</html>
